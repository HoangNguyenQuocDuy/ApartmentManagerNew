spring:
  application:
    name: discovery-service

  config:
    import: optional:configserver:http://config-service:9998 #where the config-service is running

  cloud:
    config:
      fail-fast: false #the service will not run if it can't reach the config-service

eureka:
  client:
    register-with-eureka: false #tell the build-in eureka client to not register itself with eureka, because we should act
                                #as a server
    fetch-registry: false #Eureka clients not fetch the registry information from the server and caches it local

management:
  endpoints:
    web:
      exposure:
        include: health