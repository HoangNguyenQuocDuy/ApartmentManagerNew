#version: '3.8'
services:

  config-service:
    build:
      context: .
      dockerfile: ./config-service/Dockerfile
    container_name: config_service
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9998/actuator/health || 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - apartment_network

  discovery-service:
    build:
      context: .
      dockerfile: ./discovery-service/Dockerfile
    container_name: discovery_service
    ports:
      - "9999:9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9999/actuator/health || 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      config-service:
        condition: service_healthy
    networks:
      - apartment_network

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway_service
    ports:
      - "8080:8080"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - apartment_network

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth_service
    ports:
      - "8888:8888"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - apartment_network

  access-service:
    build:
      context: .
      dockerfile: ./access-service/Dockerfile
    container_name: access_service
    ports:
      - "9012:9012"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - apartment_network

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    container_name: payment_service
    ports:
      - "9010:9010"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - apartment_network

  room-service:
    build:
      context: .
      dockerfile: ./room-service/Dockerfile
    container_name: room_service
    ports:
      - "9002:9002"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - apartment_network

  document-service:
    build:
      context: .
      dockerfile: ./document-service-1/Dockerfile
    container_name: document_service
    ports:
      - "9003:9003"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - apartment_network

  visitor-service:
    build:
      context: .
      dockerfile: ./visitor-service/Dockerfile
    container_name: visitor_service
    ports:
      - "9015:9015"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - apartment_network

  redis:
    image: redis:7-alpine
    container_name: redis_container
    networks:
      - apartment_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq_container
    networks:
      - apartment_network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:12-alpine
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - apartment_network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "root" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  apartment_network:
    driver: bridge