spring:
  application:
      name: access-service

  config:
    import: optional:configserver:http://config-service:9998 #entrypoint for spring to know where look for the configuration file

  cloud:
    config:
      fail-fast: false

  datasource:
    url: jdbc:postgresql://postgres:5432/access_service
    username: root
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.transaction.jta.platform: org.hibernate.transaction.JTATransactionFactory
      hibernate:
        format_sql: true